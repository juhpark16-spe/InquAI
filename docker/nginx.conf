# 화면(React 빌드 결과) + /api 는 백엔드로
server {
    listen 80;
    server_name _;
    server_tokens off;            # 응답에 nginx 버전을 드러내지 않음

    root /usr/share/nginx/html;
    index index.html;

    # 개발 서버(vite.config.ts)와 같은 보안 헤더: 다른 사이트의 iframe 안에 뜨지 않게 (클릭재킹 방지) 등
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 문의 사진: 1장 5MB × 3장 + 여유
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # 실제 접속 IP (요청 제한·로그인 잠금·감사 로그)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                          # AI 초안·FAQ 추천은 LLM을 기다림
    }

    # 빌드된 파일 이름에 내용 해시가 붙어 있어 오래 캐시해도 됨
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 화면 주소(/admin/inquiries/51 등)는 모두 index.html 로 (React Router가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
